services:
  postgres:
    image: postgres:16
    container_name: invox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invox_user
      POSTGRES_PASSWORD: invox_password
      POSTGRES_DB: invox_dev
    ports:
      - "5432:5432"
    volumes:
      - invox_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: invox_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  pricing-engine:
    build:
      context: ../../services/pricing-engine
    container_name: invox_pricing_engine
    restart: unless-stopped
    ports:
      - "4001:4001"

  api:
    build:
      context: ../../apps/api
    container_name: invox_api
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env
    environment:
      APP_PORT: 3001
      DATABASE_URL: postgresql://invox_user:invox_password@postgres:5432/invox_dev?schema=public
      REDIS_HOST: redis
      PRICING_ENGINE_URL: http://pricing-engine:4001
      CREDIT_ENGINE_URL: http://credit-engine:4002
      FUNDING_ENGINE_URL: http://funding-engine:4003
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - pricing-engine

volumes:
  invox_postgres_data:
